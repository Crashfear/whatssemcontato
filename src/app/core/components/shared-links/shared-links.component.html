<div class="row justify-content-center shred-content mt-3">
    <div class="col" align="center">
        <ul class="share-buttons" data-source="simplesharingbuttons.com" >
            <li *ngFor="let sharedLink of sharedLinks">
                <a href="{{sharedLink.url}}" title="{{sharedLink.title}}" target="_blank" ><img alt="{{sharedLink.title}}" width="32" height="32" src="{{sharedLink.imgSource}}" /></a>
            </li>
        </ul>
    </div>
</div>
